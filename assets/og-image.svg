    <path d="M44 16 L72 44 L44 72 L16 44 Z" fill="#fff" fill-opacity="0.95"/>
    <path d="M44 28 L60 44 L44 60 L28 44 Z" fill="#0078d4" fill-opacity="0.9"/>
    <circle cx="44" cy="44" r="5" fill="#fff"/>
  </g>
  <text x="192" y="110" font-size="28" font-weight="500" fill="#50e6ff" letter-spacing="2">AD</text>
  <text x="222" y="110" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">Implement</text>
  <text x="192" y="140" font-size="16" fill="#8892b0" letter-spacing="3">ENTERPRISE IT INFRASTRUCTURE</text>

  <!-- Title -->
  <text x="80" y="268" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">Active Directory</text>
  <text x="80" y="356" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-1">Implementation Guide</text>

