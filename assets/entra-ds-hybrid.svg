<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Microsoft Entra Domain Services — Hybrid Design</title>
  <desc id="d">Architecture diagram: on-premises AD DS stays the identity source of truth. Microsoft Entra Connect syncs users and password hashes to Entra ID, which feeds a Microsoft-managed Entra DS domain in Azure. An optional one-way outbound forest trust from on-prem AD to Entra DS lets on-prem users access Entra-DS-joined resources.</desc>

  <defs>
    <linearGradient id="onpremFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0078d4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0078d4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cloudFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#50e6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#50e6ff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="entraFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50e6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0078d4" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="dcFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0078d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0078d4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="connectFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4a7f5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b4a7f5" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="bridgeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#50e6ff"/>
    </linearGradient>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#50e6ff"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4a7f5"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd700"/>
    </marker>

    <!-- Icons -->
    <symbol id="iconCloud" viewBox="0 0 64 40">
      <path d="M18 28a8 8 0 0 1 2-15.7A13 13 0 0 1 45 15a8 8 0 0 1 2 15.7z" fill="#50e6ff" opacity="0.9"/>
    </symbol>
    <symbol id="iconDC" viewBox="0 0 64 64">
      <rect x="10" y="10" width="44" height="44" rx="4" fill="#0078d4" opacity="0.85"/>
      <rect x="16" y="18" width="32" height="4" fill="#fff" opacity="0.85"/>
      <rect x="16" y="26" width="32" height="4" fill="#fff" opacity="0.6"/>
      <rect x="16" y="34" width="32" height="4" fill="#fff" opacity="0.45"/>
      <circle cx="46" cy="46" r="3" fill="#57d9a3"/>
    </symbol>
    <symbol id="iconDC2" viewBox="0 0 64 64">
      <rect x="10" y="10" width="44" height="44" rx="4" fill="#50e6ff" opacity="0.85"/>
      <rect x="16" y="18" width="32" height="4" fill="#0d1b2a" opacity="0.7"/>
      <rect x="16" y="26" width="32" height="4" fill="#0d1b2a" opacity="0.5"/>
      <rect x="16" y="34" width="32" height="4" fill="#0d1b2a" opacity="0.4"/>
      <circle cx="46" cy="46" r="3" fill="#57d9a3"/>
    </symbol>
    <symbol id="iconWks" viewBox="0 0 64 64">
      <rect x="8" y="12" width="48" height="34" rx="2" fill="#0078d4" opacity="0.8"/>
      <rect x="12" y="16" width="40" height="22" fill="#50e6ff" opacity="0.6"/>
      <rect x="24" y="48" width="16" height="6" fill="#0078d4" opacity="0.6"/>
    </symbol>
    <symbol id="iconFiles" viewBox="0 0 64 64">
      <path d="M10 18h18l4 4h22v30H10z" fill="#ffa94d" opacity="0.85"/>
      <rect x="14" y="26" width="38" height="2" fill="#fff" opacity="0.6"/>
      <rect x="14" y="32" width="38" height="2" fill="#fff" opacity="0.45"/>
    </symbol>
    <symbol id="iconApp" viewBox="0 0 64 64">
      <rect x="10" y="10" width="44" height="44" rx="6" fill="#57d9a3" opacity="0.8"/>
      <circle cx="22" cy="24" r="4" fill="#fff" opacity="0.9"/>
      <circle cx="42" cy="24" r="4" fill="#fff" opacity="0.9"/>
      <circle cx="22" cy="42" r="4" fill="#fff" opacity="0.9"/>
      <circle cx="42" cy="42" r="4" fill="#fff" opacity="0.9"/>
    </symbol>
    <symbol id="iconAVD" viewBox="0 0 64 64">
      <rect x="6" y="14" width="52" height="34" rx="2" fill="#b4a7f5" opacity="0.8"/>
      <rect x="10" y="18" width="44" height="26" fill="#1a1a2e" opacity="0.65"/>
      <rect x="18" y="52" width="28" height="4" fill="#b4a7f5" opacity="0.6"/>
      <circle cx="32" cy="31" r="7" fill="#50e6ff" opacity="0.75"/>
    </symbol>
    <symbol id="iconSQL" viewBox="0 0 64 64">
      <ellipse cx="32" cy="14" rx="20" ry="6" fill="#ff6b6b" opacity="0.8"/>
      <path d="M12 14v36c0 4 9 7 20 7s20-3 20-7V14" fill="#ff6b6b" opacity="0.65"/>
      <ellipse cx="32" cy="26" rx="20" ry="6" fill="#ff6b6b" opacity="0.4"/>
      <ellipse cx="32" cy="38" rx="20" ry="6" fill="#ff6b6b" opacity="0.4"/>
    </symbol>
    <symbol id="iconSync" viewBox="0 0 64 64">
      <path d="M16 32a16 16 0 0 1 28-10l6-6v16H34l6-6a10 10 0 0 0-18 6" fill="#b4a7f5" opacity="0.85"/>
      <path d="M48 32a16 16 0 0 1-28 10l-6 6V32h16l-6 6a10 10 0 0 0 18-6" fill="#b4a7f5" opacity="0.65"/>
    </symbol>
    <symbol id="iconShield" viewBox="0 0 64 64">
      <path d="M32 8l20 6v14c0 14-8 24-20 28-12-4-20-14-20-28V14z" fill="#b4a7f5" opacity="0.85"/>
      <path d="M22 32l8 8 14-16" stroke="#fff" stroke-width="4" fill="none" opacity="0.9"/>
    </symbol>
    <symbol id="iconMFA" viewBox="0 0 64 64">
      <rect x="20" y="12" width="24" height="40" rx="4" fill="#57d9a3" opacity="0.85"/>
      <rect x="24" y="18" width="16" height="22" fill="#0d1b2a" opacity="0.4"/>
      <circle cx="32" cy="46" r="3" fill="#0d1b2a" opacity="0.5"/>
    </symbol>
    <symbol id="iconBuilding" viewBox="0 0 64 64">
      <rect x="10" y="18" width="44" height="40" fill="#0078d4" opacity="0.8"/>
      <rect x="14" y="12" width="36" height="8" fill="#0078d4" opacity="0.6"/>
      <rect x="16" y="24" width="6" height="6" fill="#50e6ff" opacity="0.7"/>
      <rect x="26" y="24" width="6" height="6" fill="#50e6ff" opacity="0.7"/>
      <rect x="36" y="24" width="6" height="6" fill="#50e6ff" opacity="0.7"/>
      <rect x="16" y="34" width="6" height="6" fill="#50e6ff" opacity="0.7"/>
      <rect x="26" y="34" width="6" height="6" fill="#50e6ff" opacity="0.7"/>
      <rect x="36" y="34" width="6" height="6" fill="#50e6ff" opacity="0.7"/>
      <rect x="28" y="46" width="8" height="12" fill="#0d1b2a" opacity="0.4"/>
    </symbol>
  </defs>

  <!-- Title -->
  <text x="620" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0078d4">Microsoft Entra Domain Services &#8212; Hybrid Design</text>
  <text x="620" y="58" text-anchor="middle" font-size="12" fill="#8892b0">On-prem AD DS is the source of truth. Entra Connect (PHS) syncs identities to Entra ID, which feeds the managed Entra DS domain in Azure.</text>

  <!-- ===== LEFT COLUMN: On-Premises ===== -->
  <g id="col-onprem">
    <rect x="30" y="86" width="520" height="620" rx="14" fill="url(#onpremFill)" stroke="#0078d4" stroke-opacity="0.5" stroke-width="1.5"/>
    <use href="#iconBuilding" x="46" y="100" width="32" height="32"/>
    <text x="84" y="116" font-size="11" font-weight="700" fill="#0078d4" letter-spacing="1">ON-PREMISES DATACENTER</text>
    <text x="84" y="132" font-size="13" font-weight="700" fill="#e8eaf0">corp.contoso.com</text>

    <!-- Forest box -->
    <rect x="54" y="150" width="472" height="220" rx="10" fill="none" stroke="#50e6ff" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="74" y="170" font-size="11" font-weight="700" fill="#50e6ff">&#127795; Forest: corp.contoso.com</text>

    <!-- Domain box -->
    <rect x="74" y="180" width="432" height="180" rx="8" fill="none" stroke="#0078d4" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="94" y="200" font-size="11" font-weight="700" fill="#0078d4">&#127968; AD DS Domain</text>

    <!-- DC 1 -->
    <g transform="translate(104,214)">
      <rect width="180" height="60" rx="8" fill="#0d1b2a" stroke="#0078d4" stroke-opacity="0.65"/>
      <use href="#iconDC" x="10" y="6" width="48" height="48"/>
      <text x="70" y="24" font-size="13" font-weight="700" fill="#e8eaf0">DC-01</text>
      <text x="70" y="40" font-size="10" fill="#8892b0">PDC / FSMO roles</text>
    </g>
    <!-- DC 2 -->
    <g transform="translate(300,214)">
      <rect width="180" height="60" rx="8" fill="#0d1b2a" stroke="#0078d4" stroke-opacity="0.65"/>
      <use href="#iconDC" x="10" y="6" width="48" height="48"/>
      <text x="70" y="24" font-size="13" font-weight="700" fill="#e8eaf0">DC-02</text>
      <text x="70" y="40" font-size="10" fill="#8892b0">GC / redundancy</text>
    </g>

    <!-- On-prem workload pills -->
    <g transform="translate(104,288)">
      <rect width="120" height="28" rx="14" fill="#1a1a2e" stroke="#0078d4" stroke-opacity="0.45"/>
      <use href="#iconWks" x="6" y="4" width="20" height="20"/>
      <text x="32" y="18" font-size="11" fill="#e8eaf0">Workstations</text>
    </g>
    <g transform="translate(232,288)">
      <rect width="118" height="28" rx="14" fill="#1a1a2e" stroke="#0078d4" stroke-opacity="0.45"/>
      <use href="#iconFiles" x="6" y="4" width="20" height="20"/>
      <text x="32" y="18" font-size="11" fill="#e8eaf0">File / Print</text>
    </g>
    <g transform="translate(358,288)">
      <rect width="118" height="28" rx="14" fill="#1a1a2e" stroke="#0078d4" stroke-opacity="0.45"/>
      <use href="#iconApp" x="6" y="4" width="20" height="20"/>
      <text x="32" y="18" font-size="11" fill="#e8eaf0">LoB apps</text>
    </g>

    <!-- Entra Connect box -->
    <g transform="translate(54,398)">
      <rect width="472" height="80" rx="10" fill="url(#connectFill)" stroke="#b4a7f5" stroke-opacity="0.7" stroke-width="1.5"/>
      <use href="#iconSync" x="18" y="18" width="44" height="44"/>
      <text x="80" y="36" font-size="14" font-weight="700" fill="#e8eaf0">Microsoft Entra Connect</text>
      <text x="80" y="54" font-size="11" fill="#b4a7f5">Password Hash Sync (PHS) &mdash; required for Entra DS</text>
      <text x="80" y="70" font-size="10" fill="#8892b0">Syncs users, groups, UPN, and NTLM/Kerberos hashes to Entra ID</text>
    </g>

    <text x="290" y="510" text-anchor="middle" font-size="11" font-style="italic" fill="#8892b0">Source of truth &mdash; you continue to manage these DCs, GPOs, backups.</text>

    <!-- Legend row at bottom -->
    <g transform="translate(54,540)">
      <text x="0" y="0" font-size="10" font-weight="700" fill="#0078d4" letter-spacing="1">ON-PREM RESPONSIBILITY</text>
      <text x="0" y="18" font-size="11" fill="#e8eaf0">&#9679; Hardware / VMs for DCs</text>
      <text x="0" y="36" font-size="11" fill="#e8eaf0">&#9679; Patching, backup, replication</text>
      <text x="0" y="54" font-size="11" fill="#e8eaf0">&#9679; FSMO roles, DNS, GPO</text>
      <text x="0" y="72" font-size="11" fill="#e8eaf0">&#9679; krbtgt rotation, AD recycle bin</text>
      <text x="0" y="90" font-size="11" fill="#e8eaf0">&#9679; Site &amp; subnet design for clients</text>
    </g>
  </g>

  <!-- ===== CENTER BRIDGE ===== -->
  <g id="bridge">
    <use href="#iconCloud" x="572" y="150" width="96" height="60"/>
    <!-- gradient line -->
    <line x1="570" y1="240" x2="670" y2="240" stroke="url(#bridgeLine)" stroke-width="3"/>
    <polygon points="665,232 680,240 665,248" fill="#50e6ff"/>
    <polygon points="575,232 560,240 575,248" fill="#0078d4"/>
    <text x="620" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#b4a7f5">ExpressRoute</text>
    <text x="620" y="284" text-anchor="middle" font-size="11" fill="#8892b0">or Site-to-Site VPN</text>
    <text x="620" y="306" text-anchor="middle" font-size="10" fill="#8892b0">peer Entra DS VNet to hub</text>

    <!-- sync direction (Entra Connect -> Entra ID) -->
    <line x1="546" y1="438" x2="692" y2="368" stroke="#b4a7f5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowPurple)"/>
    <text x="620" y="415" text-anchor="middle" font-size="10" font-style="italic" fill="#b4a7f5">sync</text>
  </g>

  <!-- ===== RIGHT COLUMN: Azure ===== -->
  <g id="col-cloud">
    <rect x="690" y="86" width="520" height="620" rx="14" fill="url(#cloudFill)" stroke="#50e6ff" stroke-opacity="0.55" stroke-width="1.5"/>
    <use href="#iconCloud" x="706" y="98" width="42" height="26"/>
    <text x="752" y="116" font-size="11" font-weight="700" fill="#50e6ff" letter-spacing="1">MICROSOFT AZURE</text>
    <text x="752" y="132" font-size="13" font-weight="700" fill="#e8eaf0">Managed by Microsoft</text>

    <!-- Entra ID box -->
    <g transform="translate(710,150)">
      <rect width="480" height="130" rx="10" fill="url(#entraFill)" stroke="#50e6ff" stroke-opacity="0.55" stroke-width="1.5"/>
      <use href="#iconShield" x="16" y="18" width="36" height="36"/>
      <text x="62" y="36" font-size="14" font-weight="700" fill="#e8eaf0">Microsoft Entra ID</text>
      <text x="62" y="54" font-size="11" fill="#50e6ff">Cloud identity platform (bridge on-prem + cloud)</text>

      <!-- chips -->
      <g transform="translate(16,70)">
        <rect width="80" height="26" rx="13" fill="#1a1a2e" stroke="#50e6ff" stroke-opacity="0.45"/>
        <use href="#iconMFA" x="4" y="4" width="18" height="18"/>
        <text x="28" y="17" font-size="10" fill="#e8eaf0">MFA</text>
      </g>
      <g transform="translate(104,70)">
        <rect width="136" height="26" rx="13" fill="#1a1a2e" stroke="#50e6ff" stroke-opacity="0.45"/>
        <use href="#iconShield" x="4" y="2" width="22" height="22"/>
        <text x="30" y="17" font-size="10" fill="#e8eaf0">Conditional Access</text>
      </g>
      <g transform="translate(248,70)">
        <rect width="80" height="26" rx="13" fill="#1a1a2e" stroke="#50e6ff" stroke-opacity="0.45"/>
        <text x="40" y="17" text-anchor="middle" font-size="10" fill="#e8eaf0">SSPR</text>
      </g>
      <g transform="translate(336,70)">
        <rect width="128" height="26" rx="13" fill="#1a1a2e" stroke="#50e6ff" stroke-opacity="0.45"/>
        <text x="64" y="17" text-anchor="middle" font-size="10" fill="#e8eaf0">Identity Protection</text>
      </g>
      <text x="16" y="116" font-size="10" fill="#8892b0" font-style="italic">Entra ID sits between on-prem AD and Entra DS</text>
    </g>

    <!-- Arrow to Entra DS -->
    <line x1="950" y1="288" x2="950" y2="316" stroke="#50e6ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="960" y="306" font-size="10" fill="#8892b0">sync hashes</text>

    <!-- Entra DS box -->
    <g transform="translate(710,322)">
      <rect width="480" height="180" rx="10" fill="url(#dcFill)" stroke="#0078d4" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="16" y="24" font-size="11" font-weight="700" fill="#0078d4" letter-spacing="1">ENTRA DOMAIN SERVICES</text>
      <text x="16" y="42" font-size="14" font-weight="700" fill="#e8eaf0">aadds.contoso.com</text>
      <text x="16" y="58" font-size="10" fill="#8892b0">Distinct namespace &mdash; avoids collision with corp.contoso.com</text>

      <!-- VNet -->
      <rect x="16" y="70" width="448" height="96" rx="8" fill="none" stroke="#50e6ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="32" y="88" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8892b0">Dedicated VNet &middot; peered to hub &middot; DNS: [Entra DS DC IPs]</text>

      <g transform="translate(60,100)">
        <rect width="160" height="54" rx="8" fill="#0d1b2a" stroke="#0078d4" stroke-opacity="0.6"/>
        <use href="#iconDC2" x="8" y="4" width="42" height="42"/>
        <text x="60" y="22" font-size="12" font-weight="700" fill="#e8eaf0">Managed DC-1</text>
        <text x="60" y="38" font-size="9" fill="#8892b0">Microsoft-managed</text>
      </g>
      <g transform="translate(248,100)">
        <rect width="160" height="54" rx="8" fill="#0d1b2a" stroke="#0078d4" stroke-opacity="0.6"/>
        <use href="#iconDC2" x="8" y="4" width="42" height="42"/>
        <text x="60" y="22" font-size="12" font-weight="700" fill="#e8eaf0">Managed DC-2</text>
        <text x="60" y="38" font-size="9" fill="#8892b0">HA pair</text>
      </g>
    </g>

    <!-- Azure workload pills -->
    <text x="710" y="530" font-size="10" font-weight="700" fill="#57d9a3" letter-spacing="1">AZURE WORKLOADS &mdash; JOIN aadds.contoso.com</text>
    <g transform="translate(710,544)">
      <g transform="translate(0,0)">
        <rect width="112" height="60" rx="8" fill="#0d1b2a" stroke="#57d9a3" stroke-opacity="0.4"/>
        <use href="#iconWks" x="40" y="4" width="30" height="30"/>
        <text x="56" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#e8eaf0">Azure VMs</text>
      </g>
      <g transform="translate(122,0)">
        <rect width="112" height="60" rx="8" fill="#0d1b2a" stroke="#57d9a3" stroke-opacity="0.4"/>
        <use href="#iconAVD" x="40" y="4" width="30" height="30"/>
        <text x="56" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#e8eaf0">AVD</text>
      </g>
      <g transform="translate(244,0)">
        <rect width="112" height="60" rx="8" fill="#0d1b2a" stroke="#57d9a3" stroke-opacity="0.4"/>
        <use href="#iconFiles" x="40" y="4" width="30" height="30"/>
        <text x="56" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#e8eaf0">Azure Files</text>
      </g>
      <g transform="translate(366,0)">
        <rect width="112" height="60" rx="8" fill="#0d1b2a" stroke="#57d9a3" stroke-opacity="0.4"/>
        <use href="#iconSQL" x="40" y="4" width="30" height="30"/>
        <text x="56" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#e8eaf0">SQL IaaS</text>
      </g>
    </g>

    <!-- Microsoft-managed note -->
    <g transform="translate(710,625)">
      <text x="0" y="0" font-size="10" font-weight="700" fill="#50e6ff" letter-spacing="1">MICROSOFT MANAGES</text>
      <text x="0" y="18" font-size="11" fill="#e8eaf0">&#9679; The 2 managed DCs (no OS access)</text>
      <text x="0" y="36" font-size="11" fill="#e8eaf0">&#9679; Patching, HA, platform backup</text>
      <text x="0" y="54" font-size="11" fill="#e8eaf0">&#9679; You get the AAD DC Administrators group</text>
    </g>
  </g>

  <!-- ===== TRUST LINE AT BOTTOM ===== -->
  <g id="trust">
    <rect x="30" y="728" width="1180" height="68" rx="10" fill="rgba(255,215,0,0.06)" stroke="#ffd700" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="48" y="750" font-size="11" font-weight="700" fill="#ffd700" letter-spacing="1">OPTIONAL &#8212; ONE-WAY OUTBOUND FOREST TRUST</text>

    <!-- Trust arrow from on-prem to Entra DS -->
    <path d="M160 782 Q 620 760 1080 782" stroke="#ffd700" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowGold)"/>
    <text x="620" y="782" text-anchor="middle" font-size="11" fill="#e8eaf0">on-prem AD DS <tspan fill="#ffd700">&#10229;trust&#10230;</tspan> Entra DS &mdash; on-prem users reach Entra-DS-joined resources without existing in Entra DS</text>
  </g>
</svg>
